services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: post_offer_engagement
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d post_offer_engagement"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      # Optional: .env is gitignored, so a fresh clone does not have one and
      # `docker compose up` would otherwise fail before Docker starts anything.
      # Without it the app still runs — every AI call returns its deterministic
      # fallback with was_fallback=true. Copy .env.example to .env and add a
      # GEMINI_API_KEY to enable the AI layer.
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/post_offer_engagement
      # Defaults so the container is fully configured with no .env present.
      # Anything set in .env wins over these.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      RUN_SCHEDULER: ${RUN_SCHEDULER:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle at build time — see frontend/Dockerfile.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    environment:
      # Two base URLs because the same code runs in two places. Server
      # Components execute inside this container and reach the API by its
      # compose service name; the browser cannot resolve `api` and must use the
      # port published on the host.
      API_URL_INTERNAL: http://api:8000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db_data:
